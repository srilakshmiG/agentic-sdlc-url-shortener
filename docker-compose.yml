name: agentic-sdlc-shortener

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shortener}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  api:
    build:
      context: ./backend
      target: runtime
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/shortener
      DB_USER: shortener
      DB_PASSWORD: ${POSTGRES_PASSWORD:-shortener}
      KAFKA_BOOTSTRAP: kafka:9092
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8480}
      TRUST_PROXY: "true"
    ports:
      - "8480:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    build: ./frontend
    ports:
      - "8481:80"
    depends_on:
      api:
        condition: service_healthy

  # docker compose --profile test run --rm tests
  tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: tests
    environment:
      IT_DB_URL: jdbc:postgresql://postgres:5432/shortener
      DB_URL: jdbc:postgresql://postgres:5432/shortener
      DB_USER: shortener
      DB_PASSWORD: ${POSTGRES_PASSWORD:-shortener}
      KAFKA_BOOTSTRAP: kafka:9092
      CODEBASE_PATH: /build/src/main
      STAGE_DELAY_MS: "0"
      RETRY_BACKOFF_MS: "10"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  pgdata:
